# Tool configuration only — no build-system yet, since this repo has no
# installable package. When one lands, add [project] + [build-system] and switch
# the CI install steps to `pip install -e ".[dev]"`.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["node_modules", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ARG", "PTH"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "PTH123", # open() is fine in single-purpose scripts
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
